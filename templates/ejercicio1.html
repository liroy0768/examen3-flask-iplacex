{% extends "base.html" %}

{% block title %}Ejercicio 1 - Formulario de Notas{% endblock %}

{% block content %}
<div class="tarjeta-formulario">
    <h2>Formulario de Notas</h2>
    <form method="POST" action="{{ url_for('ejercicio1') }}">
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" name="nota1" min="10" max="70" step="any" required value="{{ nota1 if nota1 is not none else '' }}">

        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" name="nota2" min="10" max="70" step="any" required value="{{ nota2 if nota2 is not none else '' }}">

        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" name="nota3" min="10" max="70" step="any" required value="{{ nota3 if nota3 is not none else '' }}">

        <label for="asistencia">Asistencia (%):</label>
        <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any" required value="{{ asistencia if asistencia is not none else '' }}">

        <button type="submit" class="btn-enviar">Enviar</button>
    </form>

    {% if promedio is not none and estado is not none %}
    <div class="resultado">
        <p>{{ promedio }}</p>
        <p>{{ estado }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
